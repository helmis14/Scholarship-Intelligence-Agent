   /* Arrow edge 1 */

  /* Arrow edge 2 */

  /* Clears any old positioning hacks */

  /* Micro-alignment to account for custom font baselines */
		transform: translateY(-1px) rotate(45deg) !important;
		transition: transform 0.2s ease !important;
	}

/* 4. Inactive State: Keeps the border box rotated pointing Right */
	.tabbed-content__tab-nav .tabbed-content__tab-btn::after {
		transform: translateY(-1px) rotate(45deg) !important;
	}

/* 5. Active State: Rotates the border box to face Up */

		transform: translateY(2px) rotate(-45deg) !important;
	}

/* Hover Adjustments */

<script>
document.addEventListener("DOMContentLoaded", function () {

  // CONFIGURATION
  const kofcColors = {
    black: '#000000',
    navy: '#112866',
    navyDark: '#0D1F50',
    white: '#FFFFFF'
  };

  const modalId = 'kofc-language-confirmation-modal';
  
  const langJson = {
    "Spanish": {
        "subheader": "Redirigiendo al sitio web en español",
        "body": "Por favor, perdone nuestro progreso. Usted se está dirigiendo al sitio web en español, el cual todavía está bajo construcción. Estamos trabajando para actualizar este sitio web para que coincida con la nueva apariencia de KofC.org. Gracias por su paciencia mientras creamos una experiencia digital de primer nivel para los Caballeros de alrededor del mundo.",
        "button": "Continúe",
        "languageSelect": "Idioma"
        },
    "French": {
        "subheader": "Redirection vers le site Internet français",
        "body": "Veuillez nous excuser pendant que nous effectuons des améliorations. Vous allez être redirigé vers le site Internet français, qui fait encore partie de l’ancienne version. Nous travaillons à mettre ce site à jour pour qu’il corresponde au nouveau style de KofC.org! Nous vous remercions pour votre patience pendant que nous créons une expérience numérique de premier plan pour les Chevaliers du monde entier.",
        "button": "Continuer",
        "languageSelect": "Langue"
        },
    "Polish": {
        "subheader": "Zaraz zostaniesz przekierowany na polską stronę",
        "body": "Wchodzisz na polskojęzyczną stronę, która nadal korzysta ze starszej wersji witryny. Pracujemy nad aktualizacją, aby dostosować ją do nowego wyglądu kofc.org. Dziękujemy za cierpliwość! Tworzymy nowoczesną platformę cyfrową dla Rycerzy na całym świecie.",
        "button": "Kontynuuj",
        "languageSelect": "Język"
        }
    };

  // INJECT CSS STYLES VIA JS
  const styleSheet = document.createElement("style");

  styleSheet.innerText = `
    /* Overlay Backdrop */
    #${modalId}-overlay {
        align-items: center;
        background-color: rgba(0,0,0,0.4); /* Slight white fade - rgba(255, 255, 255, 0.8), or use rgba(0,0,0,0.4) for dark */
        display: none;
        font-family: Arial, Helvetica, sans-serif;
        height: 100%;
        justify-content: center;
        left: 0;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 99999;
    }

    /* Modal Box Container */
    #${modalId}-box {
      align-items: flex-start;
      background: ${kofcColors.white};
      border: 0.0625rem solid #e0e0e0;
      border-radius: 0.5rem;
      box-shadow: 0.5rem 0.5rem 2.25rem 0 rgba(0, 0, 0, 0.10);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      max-width: 40.625rem;
      padding: 1.5rem;
      position: relative;
      width: auto;
    }

    /* Close Button (X) */
    #${modalId}-close {
      background-color: transparent;
      border: none;
      cursor: pointer;
      height: 1.875rem;
      position: absolute;
      right: 1.5625rem;
      top: 1.5625rem;
      width: 1.875rem;
    }

    #${modalId}-close svg {
      fill: #000;
      height: 100%;
      stroke: #000;
      stroke-width: 1;
      width: 100%;
    }

    /* Typography */
    .${modalId}-subheader {
      color: ${kofcColors.navy};
      font: 1.5rem/1.3 "Roboto-SemiBold";
      margin-bottom: 1.5rem;
      margin-top: 2.25rem;
    }

    .${modalId}-body {
      color: ${kofcColors.black};
      font: 1rem/1.3 "Roboto-Regular";
      margin-bottom: 0;
      margin-top: 0;
    }

    /* Continue Button */
    #${modalId}-continue-btn {
      align-items: center;
      background-color: ${kofcColors.white};
      border: 0.125rem solid ${kofcColors.navyDark};
      border-radius: 0.5rem;
      color: ${kofcColors.navyDark};
      cursor: pointer;
      display: flex;
      flex-shrink: 0;
      font: 1.3125rem/1.1 "Roboto-Bold";
      gap: 1rem;
      height: 4rem;
      justify-content: center;
      margin: 2.5rem auto 1rem auto;
      padding: 1.5rem 4.25rem;
      text-align: center;
      transition: background 0.2s;
      width: 13.75rem;
    }

    #${modalId}-continue-btn:hover {
      background-color: ${kofcColors.navy};
      color: ${kofcColors.white};
    }

    /* Add focus styles to buttons */
    #${modalId}-close:focus-visible,
    #${modalId}-continue-btn:focus-visible {
      outline: 2px solid transparent;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px #3a97f9;
      outline-offset: 2px;
    }
  `;

  document.head.appendChild(styleSheet);

  // BUILD MODAL HTML STRUCTURE
  const modalHTML = `
      <div id="${modalId}-box">

          <div class="${modalId}-subheader">
            Redirecting to the <span class="${modalId}-language">old KofC.org</span> website
          </div>
          <p class="${modalId}-body">
              <span>
                Please pardon our progress. You are heading to the <span class="${modalId}-language">old KofC.org</span> website, which is still part of our legacy web experience.
              </span>
              <span>
                  Over the next several months, we will be redesigning the <span class="${modalId}-language">old KofC.org</span> website to match the new KofC.org!
                  Thank you for your patience as we create a premier digital experience for Knights around the world.
              </span>
          </p>
          <button id="${modalId}-continue-btn" type="button">Continue</button>

          <button id="${modalId}-close" tyoe="button">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <g clip-path="url(#clip0_3923_25)">
                      <path d="M20 2L18 0L10 8L2 0L0 2L8 10L0 18L2 20L10 12L18 20L20 18L12 10L20 2Z" fill="black"/>
                  </g>
                  <defs>
                      <clipPath id="clip0_3923_25">
                          <rect width="20" height="20" fill="white"/>
                      </clipPath>
                  </defs>
              </svg>
          </button>
      </div>
  `;

  const modalContainer = document.createElement('div');
  modalContainer.id = `${modalId}-overlay`;
  modalContainer.innerHTML = modalHTML;
  document.body.appendChild(modalContainer);

  // LOGIC
  let pageLang = document.documentElement.lang;
  let targetUrl = '';
  
  let languageSelect = document.querySelector(`.language-select-button-text`);
  let oldLangText = languageSelect.innerText;
  
  const overlay = document.getElementById(`${modalId}-overlay`);
  const closeBtn = modalContainer.querySelector(`#${modalId}-close`);
  const continueBtn = modalContainer.querySelector(`#${modalId}-continue-btn`);

  switch(pageLang){
    case "es":
        languageSelect.innerText = langJson["Spanish"]["languageSelect"];
		break;
    case "pl":
        languageSelect.innerText = langJson["Polish"]["languageSelect"];
		break;
    case "fr":
        languageSelect.innerText = langJson["French"]["languageSelect"];
		break;
    default:
        languageSelect.innerText = "Language";
    }

  const closeModal = () => {
    overlay.style.display = 'none';
    targetUrl = '';
    languageSelect.innerHTML = `${oldLangText}`;
  };

  const openModal = (url, selectedLanguage) => {
    document.querySelectorAll(`.${modalId}-language`)
      .forEach(element => element.innerText = selectedLanguage);
    targetUrl = url;
    overlay.style.display = 'flex';
    if (continueBtn) {
      continueBtn.focus();
    }
  };

    const buildModal = (lang) => {
      // set modal values based on language selected
      let languageData = langJson[lang];
  
      let subHeaderText = languageData["subheader"];
      let bodyText = languageData["body"];
      let continueButtonText = languageData["button"];
      let languageSelectNewText = languageData["languageSelect"];


      document.querySelector(`.${modalId}-subheader`).innerHTML = `${subHeaderText}`;
      document.querySelector(`.${modalId}-body`).innerHTML = `<span>${bodyText}</span>`;
      document.querySelector(`#${modalId}-continue-btn`).innerHTML = `${continueButtonText}`;
      languageSelect.innerHTML = `${languageSelectNewText}`;
  };
  
  
    closeBtn.addEventListener('click', closeModal);

    continueBtn.addEventListener('click', () => {
        if (targetUrl) {
            window.location.href = targetUrl;
            closeModal();
        }
    });

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
    });

  // ATTACH LISTENERS (EXCLUDING ENGLISH)
  const listItems = document.querySelectorAll('li.language-select-content-option a');
  const listItemsMobile = document.querySelectorAll('.header-koc-mobile-language-select li a');

const languages = {};
languages["Español"] = "Spanish";
languages["Français"] = "French";
languages["Polski"] = "Polish";

// Combine the two NodeLists into a single array by spreading each NodeList
const allLinks = [...listItems, ...listItemsMobile];

allLinks.forEach(link => {
  // Check if the href is "/" OR if the text is "English"
  const isEnglish = link.getAttribute('href') === '/' || link.textContent.trim() === 'English';

  // Get the selected language
  const selectedLanguage = languages[link.textContent.trim()];

  // Only attach the modal listener if it is NOT English
  if (!isEnglish) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      const destination = this.getAttribute('href');
      buildModal(selectedLanguage);
      openModal(destination, selectedLanguage);
    });
  }
});
});

</script>
