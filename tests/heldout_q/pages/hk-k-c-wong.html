<script type="text/javascript">
$(document).ready(function() {
  if($('#menu').find('.menuleft').find('img').length==0||$('#menu').find('.menuleft').find('img').height()>0)
	fit_menu();
  else{
	var img_num=0;
	$('#menu').find('.menuleft').find('img').each(function(){
		$(this).load(function(){
			img_num++;
			if(img_num==$('#menu').find('.menuleft').find('img').length){
				fit_menu();
			}
		});
	});
  }
});
function fit_menu(){
	var width=($('#menu').width()-document.getElementById('menuul').clientWidth)/8/2 -0.1;
	if(width<0)
		width=0;
	for(var i=0;i<8;i++){
		$('#li'+i).css('padding','0px '+width+'px '+'0px '+width+'px ');
	}
}
</script>

	}

	location = url;
}
